            },
            {
                file: "https://kinowalk.hopto.org/scripachtv_live",
                title: "СКРИПАЧ ТВ",
                poster: "https://mafi2a-tv.ru/posters/901378.webp"
            },
            {
                file: "https://kinowalk.hopto.org/selecaotv_live",
                title: "SELECAO TV",
                poster: "https://mafi2a-tv.ru/posters/901260.webp"
            },
            {
                file: "https://kinowalk.hopto.org/vhs-forever_live",
                title: "VHS FOREVER",
                poster: "https://mafi2a-tv.ru/posters/100000001.webp"
            },
            {
                file: "https://kinowalk.hopto.org/yurich_kinomix_live",
                title: "KINOMIX",
                poster: "https://mafi2a-tv.ru/posters/901497.webp"
            },
            {
                file: "https://s.catcast.tv/content/39533/index.m3u8?token=256912513557b168d0d4f6867d29b81c",
                title: "ФАНТАСТИКА",
                poster: "https://mafi2a-tv.ru/posters/700828.webp"
            },
            {
                file: "https://ritsatv.ru/rutlive/skytennis",
                title: "SKY SPORTS TENNIS",
                poster: "https://mafi2a-tv.ru/posters/901382.webp"
            }
        ];

        // ---------- Сопоставление slug ↔ индекс ----------
        const slugs = [
            'tv12_gudauta',
            'trace_latina',
            'trace_uk',
            'muz_tv',
            'scripachtv',
            'selecao_tv',
            'vhs_forever',
            'kinomix',
            'fantastika',
            'sky_sports_tennis'
        ];

        let player;

        // ---------- Инициализация плеера ----------
        function initPlayer(index) {
            if (player) {
                player.api("stop");
                document.getElementById("player").innerHTML = "";
            }
            player = new Playerjs({
                id: "player",
                file: channels[index].file,
                poster: channels[index].poster,
                title: channels[index].title
            });
        }

        // ---------- Переключение канала (вызывается по клику) ----------
        function setChannel(index, el) {
            // Обновляем активный класс
            document.querySelectorAll('.channel').forEach(c => c.classList.remove('active'));
            el.classList.add('active');

            // Запускаем плеер
            initPlayer(index);

            // Меняем URL без перезагрузки
            const newPath = '/' + slugs[index];
            history.pushState({ channelIndex: index }, '', newPath);

            // ---------- ПЛАВНЫЙ СКРОЛЛ К ПЛЕЕРУ ----------
            const container = document.querySelector('.container');
            if (container) {
                container.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // ---------- Переключение без изменения URL (для popstate) ----------
        function switchToChannel(index) {
            const el = document.querySelector(`.channel[data-slug="${slugs[index]}"]`);
            if (!el) return;
            document.querySelectorAll('.channel').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            initPlayer(index);
            // Скролл при навигации назад/вперёд
            const container = document.querySelector('.container');
            if (container) {
                container.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        (function handleRedirect() {
            const redirectPath = sessionStorage.redirect;
            if (redirectPath) {
                delete sessionStorage.redirect;
                const slug = redirectPath.replace(/^\/+/, '');
                const index = slugs.indexOf(slug);
                if (index !== -1) {
                    const el = document.querySelector(`.channel[data-slug="${slugs[index]}"]`);
                    if (el) {
                        setChannel(index, el);
                        history.replaceState({ channelIndex: index }, '', redirectPath);
                    }
                }
            }
        })();

        // ---------- Восстановление состояния при загрузке страницы ----------
        function restoreFromURL() {
            const path = window.location.pathname; 
            const slug = path.replace(/^\/+/, ''); 
            let index = slugs.indexOf(slug);
            if (index === -1) index = 0;

            const el = document.querySelector(`.channel[data-slug="${slugs[index]}"]`);
            if (el) {
                document.querySelectorAll('.channel').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
            }
            initPlayer(index);

            const correctPath = '/' + slugs[index];
            if (path !== correctPath) {
                history.replaceState({ channelIndex: index }, '', correctPath);
            }

            // ---------- ПЛАВНЫЙ СКРОЛЛ К ПЛЕЕРУ ПРИ ЗАГРУЗКЕ ----------
            const container = document.querySelector('.container');
            if (container) {
                container.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // ---------- Обработка кнопок "Назад/Вперёд" ----------
        window.addEventListener('popstate', function(event) {
            if (event.state && event.state.channelIndex !== undefined) {
                switchToChannel(event.state.channelIndex);
            } else {
                restoreFromURL();
            }
        });

        // ---------- Запуск при загрузке ----------
        window.addEventListener('DOMContentLoaded', restoreFromURL);
    </script>
